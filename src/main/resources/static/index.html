<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 外贸商品信息标准化与多语言 SEO 系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 4px; font-size: 26px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .input-row input { flex: 1; padding: 12px 16px; font-size: 16px; border: 2px solid #ddd;
                           border-radius: 8px; outline: none; transition: border-color 0.2s; }
        .input-row input:focus { border-color: #1a73e8; }
        .btn { padding: 12px 32px; font-size: 16px; border: none; border-radius: 8px;
               cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #1a73e8; color: #fff; }
        .btn-primary:hover { background: #1557b5; }
        .btn-primary:disabled { background: #a0c4ff; cursor: not-allowed; }
        .btn-sample { background: #f0f2f5; color: #555; padding: 8px 16px; font-size: 13px; }
        .btn-sample:hover { background: #e0e2e5; }
        .samples { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .samples span { color: #888; font-size: 13px; line-height: 32px; }
        .progress { margin: 16px 0; }
        .progress-step { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: #888; font-size: 14px; }
        .progress-step.active { color: #1a73e8; font-weight: 600; }
        .progress-step.done { color: #34a853; }
        .progress-step .icon { font-size: 18px; width: 24px; text-align: center; }
        .progress-step .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #ddd;
                                   border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tab-bar { display: flex; gap: 0; border-bottom: 2px solid #eee; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; cursor: pointer; color: #666; font-weight: 500;
               border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s;
               white-space: nowrap; }
        .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        pre { background: #f8f9fa; border-radius: 8px; padding: 16px; overflow-x: auto;
              font-size: 13px; line-height: 1.6; max-height: 500px; overflow-y: auto; }
        .topk-item { display: flex; justify-content: space-between; align-items: center;
                     padding: 8px 12px; background: #f8f9fa; border-radius: 6px; margin-bottom: 6px; }
        .topk-item .sim { color: #1a73e8; font-weight: 600; font-size: 14px; }
        .error-msg { color: #d93025; background: #fce8e6; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
        .desc-text { line-height: 1.8; font-size: 14px; color: #444; }
        .desc-text .label { font-weight: 600; color: #333; display: block; margin-top: 12px; margin-bottom: 4px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #aaa; font-size: 15px; }
        .tag { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .lang-card { background: #f8f9fa; border-radius: 8px; padding: 12px; border-left: 3px solid #1a73e8; }
        .lang-code { font-weight: 600; color: #1a73e8; font-size: 13px; margin-bottom: 4px; }
        .lang-text { font-size: 13px; color: #444; line-height: 1.5; }
        .seo-card { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .seo-label { font-weight: 600; color: #555; font-size: 13px; display: block; margin-bottom: 4px; }
        .seo-value { font-size: 14px; color: #333; line-height: 1.5; }
        .kw-tag { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 4px 12px;
                  border-radius: 14px; font-size: 12px; margin: 3px 4px 3px 0; }
        .flag-icon { font-size: 16px; margin-right: 4px; }
        footer { text-align: center; color: #aaa; font-size: 13px; margin-top: 32px; }
        @media (max-width: 768px) {
            .input-row { flex-direction: column; }
            .btn { width: 100%; }
            .lang-grid { grid-template-columns: 1fr; }
            .tab { padding: 8px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌐 AI 外贸商品信息标准化与多语言 SEO 系统</h1>
    <p class="subtitle">RAG + LLM 驱动 · 一键生成结构化数据 · 多语言翻译 · SEO 元数据</p>

    <!-- Input -->
    <div class="card">
        <div class="input-row">
            <input type="text" id="partNumber" placeholder="输入外贸商品型号，如 STM32F103C8T6"
                   onkeydown="if(event.key==='Enter') generate()">
            <button class="btn btn-primary" id="generateBtn" onclick="generate()">🚀 一键生成</button>
        </div>
        <div class="samples">
            <span>快速示例：</span>
            <button class="btn btn-sample" onclick="fillSample('STM32F103C8T6')">STM32F103C8T6 (MCU)</button>
            <button class="btn btn-sample" onclick="fillSample('TPS5430')">TPS5430 (电源IC)</button>
            <button class="btn btn-sample" onclick="fillSample('LM358')">LM358 (运放)</button>
            <button class="btn btn-sample" onclick="fillSample('RC0603FR-07100RL')">RC0603FR-07100RL (电阻)</button>
        </div>
    </div>

    <!-- Progress -->
    <div class="card" id="progressCard" style="display:none;">
        <div class="progress" id="progressSteps">
            <div class="progress-step" id="step1"><span class="icon">○</span> RAG 相似商品检索 ...</div>
            <div class="progress-step" id="step2"><span class="icon">○</span> AI 结构化 + 多语言翻译 ...</div>
            <div class="progress-step" id="step3"><span class="icon">○</span> SEO 元数据生成 ...</div>
        </div>
    </div>

    <!-- Error -->
    <div class="card" id="errorCard" style="display:none;">
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Results -->
    <div class="card" id="resultCard" style="display:none;">
        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('json', this)">📊 标准化数据</div>
            <div class="tab" onclick="switchTab('multi', this)">🌍 多语言翻译</div>
            <div class="tab" onclick="switchTab('seo', this)">🔍 SEO 信息</div>
            <div class="tab" onclick="switchTab('desc', this)">📝 技术描述</div>
        </div>

        <div class="tab-content active" id="tab-json">
            <pre id="jsonOutput">等待数据...</pre>
        </div>

        <div class="tab-content" id="tab-multi">
            <div id="multiOutput"><div class="empty-state">暂无翻译数据</div></div>
        </div>

        <div class="tab-content" id="tab-seo">
            <div id="seoOutput"><div class="empty-state">暂无 SEO 数据</div></div>
        </div>

        <div class="tab-content" id="tab-desc">
            <div id="descOutput"><div class="empty-state">暂无数据</div></div>
        </div>
    </div>

    <!-- TOP-K -->
    <div class="card" id="topkCard" style="display:none;">
        <h3 style="font-size:15px;margin-bottom:12px;">📌 召回参考 (TOP-3)</h3>
        <div id="topkList"></div>
        <div style="margin-top:12px;font-size:12px;color:#888;">
            <span class="tag">RAG</span> 本地 n-gram 向量检索 + 余弦相似度
        </div>
    </div>

    <!-- Fallback message -->
    <div class="card" id="fallbackCard" style="display:none;">
        <div style="color:#f9ab00;font-weight:500;">⚠️ <span id="fallbackMsg"></span></div>
    </div>

    <footer>AI 驱动的外贸商品信息标准化与 SEO 优化系统</footer>
</div>

<script>
    const API_BASE = window.location.origin + '/hq';

    function fillSample(mpn) {
        document.getElementById('partNumber').value = mpn;
    }

    async function generate() {
        const partNumber = document.getElementById('partNumber').value.trim();
        if (!partNumber) {
            showError('请输入商品型号');
            return;
        }

        // Reset UI
        hideAll();
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('progressCard').style.display = 'block';
        setStep('step1', 'active');

        try {
            // Step 1: RAG
            await delay(400);
            setStep('step1', 'done');
            setStep('step2', 'active');

            // Step 2+3: API call
            const response = await fetch(API_BASE + '/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ partNumber })
            });

            setStep('step2', 'done');
            setStep('step3', 'active');
            await delay(200);

            const result = await response.json();
            setStep('step3', 'done');

            if (!result.success) {
                showError(result.message || '处理失败');
                document.getElementById('generateBtn').disabled = false;
                return;
            }

            if (result.message) {
                document.getElementById('fallbackCard').style.display = 'block';
                document.getElementById('fallbackMsg').textContent = result.message;
            }

            displayResults(result.data);

        } catch (err) {
            setStep('step1', 'active');
            showError('请求失败: ' + err.message + '。请检查网络连接和后端服务。');
        } finally {
            document.getElementById('generateBtn').disabled = false;
        }
    }

    function displayResults(data) {
        // ===== JSON tab =====
        const jsonDisplay = {
            part_number: data.partNumber,
            brand: data.brand,
            category: data.category,
            parameters: data.parameters || {},
            standard_desc: data.standardDesc,
            applications: data.applications || [],
            multilingual: data.multilingual || {},
            seo: data.seo || {},
            reasoning_steps: data.reasoningSteps || []
        };
        document.getElementById('jsonOutput').textContent = JSON.stringify(jsonDisplay, null, 2);

        // ===== Multilingual tab =====
        let multiHtml = '';
        if (data.multilingual && Object.keys(data.multilingual).length > 0) {
            const langNames = {
                'en': '🇬🇧 English', 'zh': '🇨🇳 中文', 'es': '🇪🇸 Español',
                'ar': '🇸🇦 العربية', 'fr': '🇫🇷 Français', 'ru': '🇷🇺 Русский',
                'pt': '🇧🇷 Português', 'de': '🇩🇪 Deutsch', 'ja': '🇯🇵 日本語',
                'ko': '🇰🇷 한국어'
            };
            const langOrder = ['en', 'zh', 'es', 'ar', 'fr', 'ru', 'pt', 'de', 'ja', 'ko'];
            multiHtml = '<p style="color:#888;font-size:13px;margin-bottom:12px;">🌍 多语言商品描述，适用于全球外贸推广</p><div class="lang-grid">';
            for (const code of langOrder) {
                if (data.multilingual[code]) {
                    const name = langNames[code] || code;
                    multiHtml += '<div class="lang-card">'
                        + '<div class="lang-code">' + name + '</div>'
                        + '<div class="lang-text">' + escapeHtml(data.multilingual[code]) + '</div>'
                        + '</div>';
                }
            }
            multiHtml += '</div>';
        } else {
            multiHtml = '<div class="empty-state">暂无多语言翻译数据（AI 返回后显示）</div>';
        }
        document.getElementById('multiOutput').innerHTML = multiHtml;

        // ===== SEO tab =====
        let seoHtml = '';
        if (data.seo) {
            if (data.seo.metaTitle) {
                seoHtml += '<div class="seo-card">'
                    + '<span class="seo-label">🔖 Meta Title（SEO标题）</span>'
                    + '<div class="seo-value">' + escapeHtml(data.seo.metaTitle) + '</div>'
                    + '</div>';
            }
            if (data.seo.metaDescription) {
                seoHtml += '<div class="seo-card">'
                    + '<span class="seo-label">📄 Meta Description（SEO描述）</span>'
                    + '<div class="seo-value">' + escapeHtml(data.seo.metaDescription) + '</div>'
                    + '</div>';
            }
            if (data.seo.keywords && data.seo.keywords.length > 0) {
                seoHtml += '<div class="seo-card">'
                    + '<span class="seo-label">🏷️ Keywords（关键词）</span>'
                    + '<div class="seo-value">';
                data.seo.keywords.forEach(kw => {
                    seoHtml += '<span class="kw-tag">#' + escapeHtml(kw) + '</span>';
                });
                seoHtml += '</div></div>';
            }
        }
        if (!seoHtml) {
            seoHtml = '<div class="empty-state">暂无 SEO 数据</div>';
        }
        document.getElementById('seoOutput').innerHTML = seoHtml;

        // ===== Description tab =====
        let descHtml = '';
        if (data.standardDesc) {
            descHtml += '<div class="label">📋 英文商品描述</div><p class="desc-text">' + escapeHtml(data.standardDesc) + '</p>';
        }
        if (data.applications && data.applications.length > 0) {
            descHtml += '<div class="label">🎯 应用场景</div><div class="desc-text">';
            data.applications.forEach(app => { descHtml += '<span class="tag" style="margin:2px 4px">' + escapeHtml(app) + '</span>'; });
            descHtml += '</div>';
        }
        if (data.reasoningSteps && data.reasoningSteps.length > 0) {
            descHtml += '<div class="label">🧠 分析推理步骤</div><ol class="desc-text">';
            data.reasoningSteps.forEach(step => { descHtml += '<li>' + escapeHtml(step) + '</li>'; });
            descHtml += '</ol>';
        }
        document.getElementById('descOutput').innerHTML = descHtml || '<div class="empty-state">暂无描述数据</div>';

        // ===== TOP-K =====
        if (data.topK && data.topK.length > 0) {
            let topkHtml = '';
            data.topK.forEach((item, i) => {
                topkHtml += '<div class="topk-item">'
                    + '<span>' + (i+1) + '. <strong>' + escapeHtml(item.partNumber) + '</strong> <span style="color:#888;font-size:13px;">' + escapeHtml(item.brand || '') + '</span></span>'
                    + '<span class="sim">' + (item.similarity * 100).toFixed(1) + '%</span>'
                    + '</div>';
            });
            document.getElementById('topkList').innerHTML = topkHtml;
            document.getElementById('topkCard').style.display = 'block';
        }

        document.getElementById('resultCard').style.display = 'block';
    }

    function switchTab(tabName, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
    }

    function setStep(id, status) {
        const el = document.getElementById(id);
        el.classList.remove('active', 'done');
        if (status === 'active') {
            el.classList.add('active');
            el.querySelector('.icon').innerHTML = '<span class="spinner"></span>';
        } else if (status === 'done') {
            el.classList.add('done');
            el.querySelector('.icon').textContent = '✓';
        }
    }

    function showError(msg) {
        document.getElementById('errorCard').style.display = 'block';
        document.getElementById('errorMsg').textContent = '⚠️ ' + msg;
    }

    function hideAll() {
        document.getElementById('errorCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('topkCard').style.display = 'none';
        document.getElementById('fallbackCard').style.display = 'none';
        document.getElementById('progressCard').style.display = 'none';
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
