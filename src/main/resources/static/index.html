<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸商品信息标准化与多语言 SEO 系统</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ 设计令牌（与前台 detail 统一） ============ */
  :root {
    --ink: #16211b;
    --ink-2: #44524a;
    --ink-3: #75827a;
    --bg: #ffffff;
    --surface: #f4f7f4;
    --surface-2: #e9efe9;
    --line: #e4eae4;
    --line-strong: #d3dcd4;
    --brand: #0e6b3d;
    --brand-dark: #0a5230;
    --brand-tint: #e7f2ea;
    --copper: #e06a24;
    --copper-strong: #b84912;
    --copper-tint: #fbece1;
    --danger: #d93025;
    --danger-tint: #fce8e6;
    --ok: #188038;
    --ok-tint: #e6f4ea;
    --warn: #8a6d1a;
    --warn-tint: #fef7e0;
    --warn-line: #f0d17a;
    --font-display: 'Space Grotesk', 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow-card: 0 1px 2px rgba(22, 33, 27, .05), 0 8px 24px -16px rgba(22, 33, 27, .18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font-body); background: var(--surface); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { color: var(--brand-dark); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 2px; }

  h1 { font-family: var(--font-display); color: var(--ink); font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; }
  .subtitle { color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }

  /* ============ 布局 ============ */
  .app { display: flex; min-height: 100vh; align-items: stretch; }

  /* ============ 左侧菜单（深色） ============ */
  .sidebar { width: 224px; flex-shrink: 0; background: var(--ink); border-right: 1px solid #0c1510; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 14px 0; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 20px 16px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand-mark { width: 34px; height: 34px; flex: none; background: var(--brand); color: #fff; font-family: var(--font-mono); font-weight: 600; font-size: 14px; letter-spacing: .5px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .brand-text { color: #e7f0e9; font-family: var(--font-display); font-size: 15px; font-weight: 600; line-height: 1.2; }
  .brand-text small { display: block; font-size: 11px; color: #7f9186; font-family: var(--font-mono); font-weight: 400; }
  .menu-title { display: flex; align-items: center; justify-content: space-between; padding: 11px 20px; font-size: 14px; color: #dbe6de; cursor: pointer; user-select: none; transition: background .15s ease; }
  .menu-title:hover { background: rgba(255,255,255,.06); color: #fff; }
  .arrow { font-size: 12px; color: #7f9186; }
  .submenu { list-style: none; background: rgba(0,0,0,.22); border-top: 1px solid rgba(255,255,255,.05); }
  .submenu-item { padding: 10px 20px 10px 40px; font-size: 13px; color: #a9b8ae; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .submenu-item:hover { color: #fff; background: rgba(255,255,255,.08); }
  .submenu-item.active { background: var(--brand); color: #fff; }

  /* ============ 内容区 ============ */
  .content { flex: 1; min-width: 0; padding: 22px 28px; }
  .content h1 { text-align: left; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
  .card h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }
  .card h3::before { content: ""; width: 10px; height: 10px; background: var(--brand); border-radius: 2px; flex: none; }
  .page-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
  .page-title::before { content: ""; width: 12px; height: 12px; background: var(--brand); border-radius: 3px; flex: none; }

  /* ============ 表单 ============ */
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, textarea, select { padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; color: var(--ink); background: #fff; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  input::placeholder, textarea::placeholder { color: var(--ink-3); }
  input[type=text], select { min-width: 130px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; margin-top: 8px; }

  /* ============ 按钮 ============ */
  button { padding: 9px 18px; border: none; border-radius: var(--radius-sm); background: var(--brand); color: #fff; cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 500; min-height: 38px; transition: background .15s ease, transform .1s ease; }
  button:hover { background: var(--brand-dark); }
  button:active { transform: translateY(1px); }
  button:disabled { background: #b7c9bd; color: #fff; cursor: not-allowed; }
  button.secondary { background: var(--surface-2); color: var(--ink-2); }
  button.secondary:hover { background: var(--line-strong); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #b3261e; }
  .back-btn { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .back-btn:hover { background: var(--brand-tint); }

  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .field label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; font-weight: 500; }
  .field input, .field select { width: 100%; }
  .param-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .param-row input { flex: 1; }

  /* ============ 多语言 / SEO 卡片 ============ */
  .lang-card, .seo-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
  .lang-card h4, .seo-card h4 { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--brand-dark); margin-bottom: 6px; }
  .lang-card textarea { min-height: 70px; }
  .seo-card input { width: 100%; }

  /* ============ 表格 ============ */
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { background: var(--surface); color: var(--ink-2); font-family: var(--font-mono); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  tbody tr:last-child td { border-bottom: none; }

  /* ============ 表格行操作 ============ */
  .table-actions { display: flex; gap: 8px; }
  .table-actions button { padding: 5px 12px; font-size: 12.5px; min-height: 0; }

  .tag { display: inline-block; background: var(--brand-tint); color: var(--brand-dark); padding: 2px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }
  .topk { display: flex; gap: 10px; flex-wrap: wrap; }
  .topk-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; color: var(--ink-2); }

  /* ============ 提示信息 ============ */
  .error { color: var(--danger); background: var(--danger-tint); border: 1px solid #f3c2bd; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; }
  .success { color: var(--ok); background: var(--ok-tint); border: 1px solid #bfe3c8; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; }
  .banner { background: var(--warn-tint); border: 1px solid var(--warn-line); color: var(--warn); border-radius: var(--radius-sm); padding: 8px 14px; margin-bottom: 12px; font-size: 13px; }
  .banner a { color: var(--brand); font-weight: 500; }
  .pagination { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .muted { color: var(--ink-3); font-size: 12px; }
  .label { font-weight: 600; color: var(--ink-2); display: block; margin: 10px 0 4px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; font-size: 13px; }
  .kv div b { color: var(--ink-3); font-weight: 500; }

  /* ============ 右侧 AI 结果抽屉 ============ */
  .ai-overlay { position: fixed; inset: 0; background: rgba(22, 33, 27, .35); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .ai-overlay.show { opacity: 1; pointer-events: auto; }
  .ai-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: #fff; z-index: 901; box-shadow: -4px 0 24px rgba(22,33,27,.18); transform: translateX(100%); transition: transform .28s ease; display: flex; flex-direction: column; }
  .ai-drawer.show { transform: translateX(0); }
  .ai-drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .ai-drawer-header h3 { font-family: var(--font-display); font-size: 16px; color: var(--ink); }
  .ai-drawer-header .sub { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-weight: 400; }
  .ai-close { background: none; border: none; font-size: 24px; line-height: 1; color: var(--ink-3); cursor: pointer; padding: 0 4px; }
  .ai-close:hover { color: var(--ink); }
  .ai-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .ai-drawer-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface); }
  .ai-preview-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; white-space: pre-wrap; color: var(--ink-2); }
  .ai-field-list { display: flex; flex-direction: column; gap: 8px; }
  .ai-field-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); transition: background .15s ease; }
  .ai-field-row:hover { background: var(--surface); }
  .ai-check { display: flex; align-items: center; gap: 8px; min-width: 120px; flex-shrink: 0; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .ai-check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
  .ai-field-value { font-size: 13px; color: var(--ink); word-break: break-all; }
  .ai-group-row { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .ai-group-row .ai-check { margin-bottom: 8px; }

  /* ============ 响应式 ============ */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: none; }
    .content { padding: 16px; }
    .grid3 { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">HQ</span>
        <span class="brand-text">HQ mall<small>商品资料工作台</small></span>
      </div>
      <div v-for="m in menus" :key="m.key" class="menu-item">
        <div class="menu-title" @click="toggleMenu(m)">
          <span>{{ m.label }}</span>
          <span class="arrow">{{ expandedMenus[m.key] ? '▾' : '▸' }}</span>
        </div>
        <ul v-show="expandedMenus[m.key]" class="submenu">
          <li v-for="c in m.children" :key="c.key" class="submenu-item"
              :class="{ active: activeMenu === c.key }"
              @click="selectMenu(m, c)">{{ c.label }}</li>
        </ul>
      </div>
    </aside>
    <main class="content">
      <h1>商品资料管理</h1>
      <p class="subtitle">AI 解析 · 英文描述 · 多语言 · SEO</p>

      <div v-if="featureDeveloping" class="card" style="text-align:center;">
        <p style="color:#999;padding:40px 0;">🚧 「{{ activeMenuLabel }}」功能开发中</p>
      </div>

    <!-- 导航：列表页内「新增商品」进入录入页，录入页「返回列表」回到列表 -->

    <div v-if="error" class="error">{{ error }}</div>
    <div v-if="success" class="success">{{ success }}</div>
    <div v-if="editingId" class="banner">正在编辑记录 #{{ editingId }}，保存后更新该记录。 <a href="javascript:;" @click="cancelEdit()" style="color:var(--brand)">取消编辑</a></div>

    <!-- ============ 当前页面（商品资料） ============ -->
    <template v-if="!featureDeveloping">

    <!-- ============ 新增/编辑录入 ============ -->
    <template v-if="view==='workbench'">
      <h3 class="page-title">{{ editingId ? '资料编辑' : '资料新增' }}</h3>
      <div class="row" style="margin-bottom:12px;">
        <button class="back-btn" @click="goList">← 返回列表</button>
      </div>
      <div class="card" v-if="!editingId">
        <h3>① 新增商品：输入与解析</h3>
        <div class="row">
          <input type="text" v-model="partNumber" placeholder="型号，如 STM32F103C8T6" @keyup.enter="parsePart">
          <input type="text" v-model="brand" placeholder="品牌（可选）">
          <button @click="parsePart" :disabled="loading">{{ loading ? '解析中...' : '解析' }}</button>
        </div>
        <textarea v-model="rawText" placeholder="粘贴大段描述（含型号/品牌/属性等），点「解析描述」提取结构化字段"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="secondary" @click="parseText" :disabled="loading">{{ loading ? '解析中...' : '解析描述' }}</button>
        </div>
        <div v-if="goodsDoc && goodsDoc.topK && goodsDoc.topK.length" style="margin-top:12px;">
          <div class="muted" style="margin-bottom:6px;">🔎 RAG 召回参考（TOP-K）</div>
          <div class="topk">
            <span v-for="(h, i) in goodsDoc.topK" :key="h.partNumber + i" class="topk-item">{{ h.partNumber }} <span class="muted">{{ h.brand || '' }} · {{ h.score }}分</span></span>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>② 基本资料</h3>
        <div class="grid3">
          <div class="field"><label>型号 *</label><input v-model="goodsDoc.partNumber"></div>
          <div class="field"><label>品牌</label><input v-model="goodsDoc.brand"></div>
          <div class="field"><label>分类</label><input v-model="goodsDoc.category"></div>
          <div class="field"><label>子分类</label><input v-model="goodsDoc.subcategory"></div>
          <div class="field"><label>系列</label><input v-model="goodsDoc.series"></div>
          <div class="field"><label>封装</label><input v-model="goodsDoc.packageType"></div>
          <div class="field"><label>安装类型</label><input v-model="goodsDoc.mountingType"></div>
          <div class="field"><label>引脚数</label><input type="number" v-model.number="goodsDoc.pinCount"></div>
          <div class="field"><label>尺寸</label><input v-model="goodsDoc.dimensions"></div>
          <div class="field"><label>工作温度</label><input v-model="goodsDoc.operatingTemp"></div>
          <div class="field"><label>存储温度</label><input v-model="goodsDoc.storageTemp"></div>
          <div class="field"><label>质量等级</label><input v-model="goodsDoc.grade"></div>
          <div class="field"><label>RoHS</label><input v-model="goodsDoc.rohs"></div>
          <div class="field"><label>包装方式</label><input v-model="goodsDoc.packaging"></div>
          <div class="field"><label>MOQ</label><input v-model="goodsDoc.moq"></div>
          <div class="field"><label>单位</label><input v-model="goodsDoc.unit"></div>
          <div class="field"><label>海关编码</label><input v-model="goodsDoc.hsCode"></div>
          <div class="field"><label>交期</label><input v-model="goodsDoc.leadTime"></div>
          <div class="field"><label>价格区间</label><input v-model="goodsDoc.priceRange"></div>
          <div class="field"><label>供货状态</label><input v-model="goodsDoc.availability"></div>
          <div class="field"><label>数据手册URL</label><input v-model="goodsDoc.datasheetUrl"></div>
          <div class="field"><label>图片URL</label><input v-model="goodsDoc.imageUrl"></div>
        </div>
        <div style="margin-top:12px;">
          <span class="label">参数（动态增删）</span>
          <div v-for="(p, i) in goodsDoc.parameters" :key="i" class="param-row">
            <input v-model="p.name">
            <input v-model="p.value">
            <input v-model="p.unit">
            <button class="secondary" @click="removeParam(i)">删除</button>
          </div>
          <button class="secondary" @click="addParam">+ 添加参数</button>
          <span class="label">应用领域</span>
          <div class="row">
            <input type="text" v-model="newApp" style="flex:1" @keyup.enter="addApp">
            <button class="secondary" @click="addApp">添加</button>
          </div>
          <div class="row" style="margin-top:6px;">
            <span v-for="(a, i) in goodsDoc.applications" :key="i" class="tag">{{ a }} <span style="cursor:pointer" @click="goodsDoc.applications.splice(i,1)">×</span></span>
          </div>
        </div>
        <div style="margin-top:14px;">
          <button @click="generateDesc" :disabled="loading">{{ loading ? '③ 生成英文描述' : '③ 生成英文描述' }}</button>
        </div>
        <div v-if="goodsDoc.descriptionEn" style="margin-top:12px;">
          <span class="label">英文描述（可编辑）</span>
          <textarea v-model="goodsDoc.descriptionEn"></textarea>
        </div>
      </div>

      <div class="card" v-if="goodsDoc && goodsDoc.descriptionEn">
        <h3>④ 多语言 + SEO 生成</h3>
        <button @click="generateMulti" :disabled="loading">{{ loading ? '生成多语言' : '生成多语言' }}</button>
        <div v-if="multiResult">
          <div style="margin-top:14px;">
            <span class="label">多语言描述（可编辑）</span>
            <div v-for="(label, code) in langLabels" :key="code" class="lang-card" v-if="multiResult.multilingual && multiResult.multilingual[code]">
              <h4>{{ label }}</h4>
              <textarea v-model="multiResult.multilingual[code]"></textarea>
            </div>
          </div>
          <div style="margin-top:14px;">
            <span class="label">SEO（中/英/日/俄）</span>
            <div v-for="(label, code) in seoLabels" :key="code" class="seo-card" v-if="multiResult.seo && multiResult.seo[code]">
              <h4>{{ label }} <button class="secondary copy" @click="copySeo(code)">复制</button></h4>
              <div class="field"><label>Title</label><input v-model="multiResult.seo[code].title"></div>
              <div class="field" style="margin-top:6px;"><label>Keywords（逗号分隔）</label><input v-model="multiResult.seo[code].keywordsText"></div>
              <div class="field" style="margin-top:6px;"><label>Description</label><textarea v-model="multiResult.seo[code].description"></textarea></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" v-if="goodsDoc">
        <button @click="save" :disabled="loading">{{ loading ? '保存' : editingId ? '保存修改' : '保存到历史' }}</button>
      </div>
    </template>

    <!-- ============ 历史列表 ============ -->
    <template v-if="view==='list'">
      <div class="card">
        <h3>商品列表</h3>
        <div class="row" style="margin-bottom:12px;">
          <input type="text" v-model="partNumberSearch" placeholder="请输入型号" @keyup.enter="searchList" style="width:260px;">
          <button class="secondary" @click="searchList">查询</button>
        </div>
        <div class="row" style="margin-bottom:12px;">
          <button @click="goNew">➕ 新增</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>型号</th><th>品牌</th><th>分类</th><th>封装</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in records" :key="r.id">
              <td>{{ r.id }}</td><td>{{ r.partNumber }}</td><td>{{ r.brand }}</td><td>{{ r.category }}</td><td>{{ r.packageType }}</td><td>{{ r.cTime }}</td>
              <td>
                <div class="table-actions">
                  <button class="secondary" @click="editRecord(r.id)">编辑</button>
                  <button class="secondary" @click="viewRecord(r.id)">查看</button>
                </div>
              </td>
            </tr>
            <tr v-if="!records.length"><td colspan="7" style="text-align:center;color:#aaa;">暂无记录</td></tr>
          </tbody>
        </table>
        <div class="pagination">
          <button class="secondary" @click="changePage(page - 1)" :disabled="page <= 1">上一页</button>
          <span>第 {{ page }} 页 / 共 {{ totalPages }} 页（共 {{ total }} 条）</span>
          <button class="secondary" @click="changePage(page + 1)" :disabled="page >= totalPages">下一页</button>
        </div>
      </div>
    </template>

    <!-- ============ 只读详情 ============ -->
    <template v-if="view==='detail' && detail">
      <div class="card">
        <h3>记录 #{{ detail.id }} 详情</h3>
        <button class="secondary" @click="editRecord(detail.id)" style="margin-bottom:12px;">编辑</button>
        <div class="kv">
          <div v-if="detail.basic.partNumber"><b>型号：</b>{{ detail.basic.partNumber }}</div>
          <div v-if="detail.basic.brand"><b>品牌：</b>{{ detail.basic.brand }}</div>
          <div v-if="detail.basic.category"><b>分类：</b>{{ detail.basic.category }}</div>
          <div v-if="detail.basic.subcategory"><b>子分类：</b>{{ detail.basic.subcategory }}</div>
          <div v-if="detail.basic.series"><b>系列：</b>{{ detail.basic.series }}</div>
          <div v-if="detail.basic.packageType"><b>封装：</b>{{ detail.basic.packageType }}</div>
          <div v-if="detail.basic.mountingType"><b>安装类型：</b>{{ detail.basic.mountingType }}</div>
          <div v-if="detail.basic.pinCount"><b>引脚数：</b>{{ detail.basic.pinCount }}</div>
          <div v-if="detail.basic.dimensions"><b>尺寸：</b>{{ detail.basic.dimensions }}</div>
          <div v-if="detail.basic.operatingTemp"><b>工作温度：</b>{{ detail.basic.operatingTemp }}</div>
          <div v-if="detail.basic.storageTemp"><b>存储温度：</b>{{ detail.basic.storageTemp }}</div>
          <div v-if="detail.basic.grade"><b>质量等级：</b>{{ detail.basic.grade }}</div>
          <div v-if="detail.basic.rohs"><b>RoHS：</b>{{ detail.basic.rohs }}</div>
          <div v-if="detail.basic.packaging"><b>包装方式：</b>{{ detail.basic.packaging }}</div>
          <div v-if="detail.basic.moq"><b>MOQ：</b>{{ detail.basic.moq }}</div>
          <div v-if="detail.basic.unit"><b>单位：</b>{{ detail.basic.unit }}</div>
          <div v-if="detail.basic.hsCode"><b>海关编码：</b>{{ detail.basic.hsCode }}</div>
          <div v-if="detail.basic.leadTime"><b>交期：</b>{{ detail.basic.leadTime }}</div>
          <div v-if="detail.basic.priceRange"><b>价格区间：</b>{{ detail.basic.priceRange }}</div>
          <div v-if="detail.basic.availability"><b>供货状态：</b>{{ detail.basic.availability }}</div>
          <div v-if="detail.basic.datasheetUrl"><b>数据手册：</b>{{ detail.basic.datasheetUrl }}</div>
          <div v-if="detail.basic.imageUrl"><b>图片：</b>{{ detail.basic.imageUrl }}</div>
        </div>
        <template v-if="detail.basic.parameters && detail.basic.parameters.length">
          <span class="label">参数</span>
          <table><thead><tr><th>参数名</th><th>数值</th><th>单位</th></tr></thead>
          <tbody><tr v-for="(p, i) in detail.basic.parameters" :key="i"><td>{{ p.name }}</td><td>{{ p.value }}</td><td>{{ p.unit }}</td></tr></tbody></table>
        </template>
        <template v-if="detail.basic.applications && detail.basic.applications.length">
          <span class="label">应用领域</span>
          <div class="row"><span v-for="(a, i) in detail.basic.applications" :key="i" class="tag">{{ a }}</span></div>
        </template>
        <div v-if="detail.basic.descriptionEn">
          <span class="label">英文描述</span>
          <pre style="white-space:pre-wrap;background:#f8f9fa;border-radius:6px;padding:12px;font-size:13px;">{{ detail.basic.descriptionEn }}</pre>
        </div>
        <template v-if="detail.multilingual">
          <span class="label">多语言描述</span>
          <div v-for="(label, code) in langLabels" :key="code" class="lang-card" v-if="detail.multilingual[code]">
            <h4>{{ label }}</h4><div style="font-size:13px;white-space:pre-wrap;">{{ detail.multilingual[code] }}</div>
          </div>
        </template>
        <template v-if="detail.seo">
          <span class="label">SEO（中/英/日/俄）</span>
          <div v-for="(label, code) in seoLabels" :key="code" class="seo-card" v-if="detail.seo[code]">
            <h4>{{ label }}</h4>
            <div class="muted">Title</div><div style="font-size:13px;">{{ detail.seo[code].title }}</div>
            <div class="muted">Keywords</div><div style="font-size:13px;">{{ (detail.seo[code].keywords || []).join(', ') }}</div>
            <div class="muted">Description</div><div style="font-size:13px;">{{ detail.seo[code].description }}</div>
          </div>
        </template>
      </div>
    </template>
    </template>
    </main>
  </div>

  <!-- ============ 右侧 AI 结果抽屉 ============ -->
  <div class="ai-overlay" :class="{show: aiPanel.open}" @click="closeAiPanel"></div>
  <div class="ai-drawer" :class="{show: aiPanel.open}">
    <div class="ai-drawer-header">
      <h3>{{ aiPanel.title }}<span class="sub">勾选单个字段即时应用 · 「应用」= 全部应用</span></h3>
      <button class="ai-close" @click="closeAiPanel">×</button>
    </div>
    <div class="ai-drawer-body">
      <!-- 解析结果预览 -->
      <template v-if="aiPanel.type === 'parse' && aiPanel.data">
        <div v-if="aiPanel.data.topK && aiPanel.data.topK.length" style="margin-bottom:12px;">
          <div class="muted" style="margin-bottom:6px;">🔎 RAG 召回参考（TOP-K）</div>
          <div class="topk">
            <span v-for="(h, i) in aiPanel.data.topK" :key="h.partNumber + i" class="topk-item">{{ h.partNumber }} <span class="muted">{{ h.brand || '' }} · {{ h.score }}分</span></span>
          </div>
        </div>
        <div class="ai-field-list">
          <template v-for="f in basicFields" :key="f.key">
            <div class="ai-field-row" v-if="aiPanel.data[f.key]">
              <label class="ai-check">
                <input type="checkbox" :checked="!!aiPanel.selected[f.key]" @change="toggleField(f.key)">
                {{ f.label }}
              </label>
              <span class="ai-field-value">{{ aiPanel.data[f.key] }}</span>
            </div>
          </template>

          <div v-if="aiPanel.data.parameters && aiPanel.data.parameters.length" class="ai-group-row">
            <label class="ai-check">
              <input type="checkbox" :checked="!!aiPanel.selected.parameters" @change="toggleField('parameters')">
              参数（{{ aiPanel.data.parameters.length }} 项）
            </label>
            <table><thead><tr><th>参数名</th><th>数值</th><th>单位</th></tr></thead>
            <tbody><tr v-for="(p, i) in aiPanel.data.parameters" :key="i"><td>{{ p.name }}</td><td>{{ p.value }}</td><td>{{ p.unit }}</td></tr></tbody></table>
          </div>

          <div v-if="aiPanel.data.applications && aiPanel.data.applications.length" class="ai-group-row">
            <label class="ai-check">
              <input type="checkbox" :checked="!!aiPanel.selected.applications" @change="toggleField('applications')">
              应用领域（{{ aiPanel.data.applications.length }} 项）
            </label>
            <div class="row"><span v-for="(a, i) in aiPanel.data.applications" :key="i" class="tag">{{ a }}</span></div>
          </div>
        </div>
      </template>

      <!-- 英文描述预览 -->
      <template v-if="aiPanel.type === 'desc'">
        <span class="label">英文描述</span>
        <div class="ai-preview-box">{{ aiPanel.data }}</div>
      </template>

      <!-- 多语言 + SEO 预览 -->
      <template v-if="aiPanel.type === 'multi' && aiPanel.data">
        <template v-if="aiPanel.data.multilingual">
          <span class="label">多语言描述</span>
          <div v-for="(label, code) in langLabels" :key="code" class="lang-card" v-if="aiPanel.data.multilingual[code]">
            <h4>{{ label }}</h4>
            <div class="ai-preview-box">{{ aiPanel.data.multilingual[code] }}</div>
          </div>
        </template>
        <template v-if="aiPanel.data.seo">
          <span class="label">SEO（中/英/日/俄）</span>
          <div v-for="(label, code) in seoLabels" :key="code" class="seo-card" v-if="aiPanel.data.seo[code]">
            <h4>{{ label }}</h4>
            <div class="muted">Title</div><div style="font-size:13px;">{{ aiPanel.data.seo[code].title }}</div>
            <div class="muted">Keywords</div><div style="font-size:13px;">{{ (aiPanel.data.seo[code].keywords || []).join(', ') }}</div>
            <div class="muted">Description</div><div style="font-size:13px;">{{ aiPanel.data.seo[code].description }}</div>
          </div>
        </template>
      </template>
    </div>
    <div class="ai-drawer-footer">
      <button class="secondary" @click="closeAiPanel">取消</button>
      <button @click="applyAiResult">✓ 应用</button>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
const API = '/goods/api/doc';

createApp({
  data() {
    return {
      view: 'list',
      loading: false, error: '', success: '',
      partNumber: 'STM32F103C8T6', brand: '', rawText: '', partNumberSearch: '',
      goodsDoc: null, multiResult: null, newApp: '',
      aiPanel: { open: false, type: '', title: '', data: null, sourceType: null },
      basicFields: [
        { key: 'partNumber', label: '型号' },
        { key: 'brand', label: '品牌' },
        { key: 'category', label: '分类' },
        { key: 'subcategory', label: '子分类' },
        { key: 'series', label: '系列' },
        { key: 'packageType', label: '封装' },
        { key: 'mountingType', label: '安装类型' },
        { key: 'pinCount', label: '引脚数' },
        { key: 'dimensions', label: '尺寸' },
        { key: 'operatingTemp', label: '工作温度' },
        { key: 'storageTemp', label: '存储温度' },
        { key: 'grade', label: '质量等级' },
        { key: 'rohs', label: 'RoHS' },
        { key: 'packaging', label: '包装方式' },
        { key: 'moq', label: 'MOQ' },
        { key: 'unit', label: '单位' },
        { key: 'hsCode', label: '海关编码' },
        { key: 'leadTime', label: '交期' },
        { key: 'priceRange', label: '价格区间' },
        { key: 'availability', label: '供货状态' },
        { key: 'datasheetUrl', label: '数据手册URL' },
        { key: 'imageUrl', label: '图片URL' }
      ],
      editingId: null, sourceType: null,
      records: [], page: 1, size: 10, total: 0, totalPages: 0,
      detail: null,
      activeMenu: 'goods',
      featureDeveloping: false,
      expandedMenus: { goods: true },
      menus: [
        { key: 'goods', label: '商品资料', children: [{ key: 'goods', label: '商品列表' }] },
        { key: 'partner', label: '合作商', children: [{ key: 'partner', label: '合作商列表' }] },
        { key: 'stock', label: '库存定价', children: [{ key: 'stock', label: '价格列表' }] },
        { key: 'goodsOps', label: '商品运营', children: [{ key: 'goodsOps', label: '运营列表' }] },
        { key: 'base', label: '基础服务', children: [{ key: 'base', label: '服务列表' }] },
        { key: 'system', label: '系统管理', children: [{ key: 'system', label: '系统设置' }] },
        { key: 'activity', label: '活动运营管理', children: [{ key: 'activity', label: '活动列表' }] },
        { key: 'market', label: '市场推广管理', children: [{ key: 'market', label: '推广列表' }] },
        { key: 'marketing', label: '营销中心', children: [{ key: 'marketing', label: '营销列表' }] },
        { key: 'content', label: '内容管理', children: [{ key: 'content', label: '内容列表' }] },
        { key: 'dashboard', label: '数据看板', children: [{ key: 'dashboard', label: '数据看板' }] },
        { key: 'partnerMgmt', label: '合作商管理', children: [{ key: 'partnerMgmt', label: '合作商管理列表' }] }
      ],
      langLabels: { en: '🇬🇧 English', zh: '🇨🇳 中文', zhTw: '🇨🇳 繁体中文', ja: '🇯🇵 日本語', ru: '🇷🇺 Русский' },
      seoLabels: { zh: '中文 SEO', en: 'English SEO', ja: '日本語 SEO', ru: 'Русский SEO' }
    };
  },
  methods: {
    clearMsg() { this.error = ''; this.success = ''; },
    async api(path, method, body) {
      const opt = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opt.body = JSON.stringify(body);
      const resp = await fetch(API + path, opt);
      const result = await resp.json();
      if (result.code !== 200) throw new Error(result.message || '请求失败');
      return result.body;
    },
    wrap(fn) {
      this.clearMsg();
      return fn().catch(e => { this.error = e.message || '请求失败'; this.loading = false; });
    },
    switchView(v) { this.view = v; this.clearMsg(); },
    goList() { this.page = 1; this.switchView('list'); this.loadList(); },
    goNew() {
      this.goodsDoc = this.emptyGoodsDoc(); this.multiResult = null; this.newApp = '';
      this.partNumber = ''; this.brand = ''; this.rawText = '';
      this.editingId = null; this.sourceType = null;
      this.aiPanel.open = false;
      this.view = 'workbench';
      this.clearMsg();
    },
    searchList() { this.page = 1; this.loadList(); },

    toggleMenu(m) {
      this.expandedMenus[m.key] = !this.expandedMenus[m.key];
      // 一级菜单「商品资料」点击即切回商品列表
      if (m.key === 'goods') {
        this.activeMenu = 'goods';
        this.featureDeveloping = false;
        this.goList();
      }
    },
    selectMenu(m, c) {
      this.activeMenu = c.key;
      if (c.key === 'goods') {
        this.featureDeveloping = false;
        this.goList();
      } else {
        this.featureDeveloping = true;
      }
    },

    normalizeVo(vo) {
      if (!vo.parameters) vo.parameters = [];
      if (!vo.applications) vo.applications = [];
      if (!vo.topK) vo.topK = [];
      return vo;
    },
    emptyGoodsDoc() {
      return {
        partNumber: '', brand: '', category: '', subcategory: '', series: '',
        packageType: '', mountingType: '', pinCount: null, dimensions: '',
        operatingTemp: '', storageTemp: '', grade: '', rohs: '', packaging: '',
        moq: '', unit: '', hsCode: '', leadTime: '', priceRange: '',
        availability: '', datasheetUrl: '', imageUrl: '', descriptionEn: '',
        parameters: [], applications: [], topK: []
      };
    },
    async parsePart() {
      if (!this.partNumber.trim()) { this.error = '请输入型号'; return; }
      this.loading = true;
      await this.wrap(async () => {
        const vo = await this.api('/parsePart', 'POST', { partNumber: this.partNumber.trim(), brand: this.brand.trim() });
        this.openAiPanel('parse', 'AI 解析结果', this.normalizeVo(vo), 1);
      });
      this.loading = false;
    },
    async parseText() {
      if (!this.rawText.trim()) { this.error = '请输入描述文本'; return; }
      this.loading = true;
      await this.wrap(async () => {
        const vo = await this.api('/parseText', 'POST', { rawText: this.rawText.trim() });
        this.openAiPanel('parse', 'AI 解析结果', this.normalizeVo(vo), 2);
      });
      this.loading = false;
    },
    async generateDesc() {
      this.loading = true;
      await this.wrap(async () => {
        const body = await this.api('/generateDesc', 'POST', { goodsDoc: this.goodsDoc });
        this.openAiPanel('desc', 'AI 英文描述', body.description, null);
      });
      this.loading = false;
    },
    async generateMulti() {
      this.loading = true;
      await this.wrap(async () => {
        const body = await this.api('/generateMulti', 'POST', { goodsDoc: this.goodsDoc, description: this.goodsDoc.descriptionEn });
        this.openAiPanel('multi', 'AI 多语言 + SEO', body, null);
      });
      this.loading = false;
    },
    openAiPanel(type, title, data, sourceType) {
      const panel = { open: true, type, title, data: data ? JSON.parse(JSON.stringify(data)) : null, sourceType: sourceType || null };
      if (type === 'parse') {
        panel.selected = {};
        this.basicFields.forEach(f => { panel.selected[f.key] = false; });
        panel.selected.parameters = false;
        panel.selected.applications = false;
      }
      this.aiPanel = panel;
      this.clearMsg();
    },
    closeAiPanel() {
      this.aiPanel.open = false;
    },
    toggleField(key) {
      const p = this.aiPanel;
      if (!p || p.type !== 'parse' || !p.data) return;
      const checked = !p.selected[key];
      p.selected[key] = checked;
      if (!this.goodsDoc) this.goodsDoc = this.emptyGoodsDoc();
      if (checked) {
        this.goodsDoc[key] = p.data[key];
      } else {
        const empty = this.emptyGoodsDoc();
        this.goodsDoc[key] = empty[key];
      }
    },
    applyAiResult() {
      const p = this.aiPanel;
      if (p.type === 'parse' && p.data) {
        this.goodsDoc = this.normalizeVo(JSON.parse(JSON.stringify(p.data)));
        this.multiResult = null; this.editingId = null; this.sourceType = p.sourceType;
        this.success = '已应用 AI 解析结果，请核对基本资料';
      } else if (p.type === 'desc') {
        if (!this.goodsDoc) this.goodsDoc = this.emptyGoodsDoc();
        this.goodsDoc.descriptionEn = p.data;
        this.success = '已应用英文描述';
      } else if (p.type === 'multi' && p.data) {
        const body = JSON.parse(JSON.stringify(p.data));
        if (body.seo) {
          Object.values(body.seo).forEach(s => { s.keywordsText = (s.keywords || []).join(', '); });
        }
        this.multiResult = body;
        this.success = '已应用多语言 + SEO';
      }
      this.aiPanel.open = false;
    },
    addParam() { this.goodsDoc.parameters.push({ name: '', value: '', unit: '' }); },
    removeParam(i) { this.goodsDoc.parameters.splice(i, 1); },
    addApp() {
      const v = (this.newApp || '').trim();
      if (v) { this.goodsDoc.applications.push(v); this.newApp = ''; }
    },
    async save() {
      this.loading = true;
      await this.wrap(async () => {
        const seo = {};
        if (this.multiResult && this.multiResult.seo) {
          Object.keys(this.multiResult.seo).forEach(code => {
            const s = this.multiResult.seo[code];
            seo[code] = {
              title: s.title || '',
              keywords: (s.keywordsText || '').split(/[,，]/).map(x => x.trim()).filter(Boolean),
              description: s.description || ''
            };
          });
        }
        const payload = {
          id: this.editingId,
          goodsDoc: this.goodsDoc,
          multilingual: this.multiResult ? this.multiResult.multilingual : null,
          seo: Object.keys(seo).length ? seo : null,
          sourceType: this.sourceType
        };
        const id = await this.api('/save', 'POST', payload);
        this.success = this.editingId ? '已更新记录 #' + id : '已保存记录 #' + id;
        this.editingId = null;
        this.rawText = '';
        this.partNumberSearch = '';
        this.view = 'list';
        this.loadList();
      });
      this.loading = false;
    },

    async loadList() {
      await this.wrap(async () => {
        const pn = (this.partNumberSearch || '').trim();
        const url = '/list?page=' + this.page + '&size=' + this.size + (pn ? '&partNumber=' + encodeURIComponent(pn) : '');
        const body = await this.api(url);
        this.records = body.list || [];
        this.total = body.total || 0;
        this.totalPages = Math.ceil(this.total / this.size) || 1;
      });
    },
    changePage(p) { if (p < 1) return; this.page = p; this.loadList(); },
    viewRecord(id) {
      window.open('/goods/detail/' + id, '_blank');
    },
    async viewDetail(id) {
      await this.wrap(async () => {
        this.detail = await this.api('/detail?id=' + id);
        this.view = 'detail';
      });
    },
    async editRecord(id) {
      await this.wrap(async () => {
        const d = await this.api('/detail?id=' + id);
        this.goodsDoc = this.normalizeVo(d.basic);
        const seo = d.seo || {};
        Object.values(seo).forEach(s => { s.keywordsText = (s.keywords || []).join(', '); });
        this.multiResult = { multilingual: d.multilingual || {}, seo };
        this.sourceType = d.sourceType;
        this.editingId = d.id;
        this.view = 'workbench';
        this.success = '已加载记录 #' + id + '，可修改后保存';
      });
    },
    cancelEdit() { this.editingId = null; this.multiResult = null; this.goodsDoc = this.emptyGoodsDoc(); this.rawText = ''; this.sourceType = null; this.aiPanel.open = false; },
    async delRecord(id) {
      if (!confirm('确认删除记录 #' + id + '？')) return;
      await this.wrap(async () => {
        await this.api('/delete?id=' + id, 'DELETE');
        this.success = '已删除记录 #' + id;
        this.loadList();
      });
    },
    async copySeo(code) {
      const s = this.multiResult.seo[code];
      const text = 'Title: ' + s.title + '\nKeywords: ' + (s.keywordsText || '') + '\nDescription: ' + s.description;
      try {
        await navigator.clipboard.writeText(text);
        this.success = '已复制 ' + code + ' SEO';
      } catch (e) {
        this.error = '复制失败，请手动复制';
      }
    }
    },
  computed: {
    activeMenuLabel() {
      for (const m of this.menus) {
        const c = m.children.find(x => x.key === this.activeMenu);
        if (c) return c.label;
      }
      return '';
    }
  },
  mounted() {
    this.loadList();
  }
}).mount('#app');
</script>
</body>
</html>
